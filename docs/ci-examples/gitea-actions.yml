# Gitea Actions — CI for the Containers monorepo
#
# Place this file at `.gitea/workflows/ci.yml`. Gitea Actions is compatible
# with GitHub Actions syntax, so the steps look the same but use the Gitea
# runner's own setup-bun action. Runs typecheck, lint, format check, tests,
# and a production build on every push to `dev` and on pull requests.
#
# Requirements:
#   - A Gitea Actions runner registered to the repo.
#   - The `actions/setup-bun` action resolvable (either from the Gitea
#     marketplace or by pinning a fork that mirrors oven-sh/setup-bun).

name: CI

on:
    push:
        branches: [dev, main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: typecheck · lint · test · build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Tests
              run: bun run test

            - name: Build
              run: bun run build

    # Optional compose smoke test — needs a runner with Docker.
    compose-smoke:
        name: Compose smoke test
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        steps:
            - uses: actions/checkout@v4
            - name: Build images
              run: docker compose build
            - name: Start stack
              run: docker compose up -d --wait
            - name: Health check
              run: |
                  docker compose ps --format '{{.Name}} {{.Status}}'
                  test "$(docker compose ps --format '{{.Status}}' | grep -c healthy)" -eq 5
