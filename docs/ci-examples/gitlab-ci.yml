# GitLab CI — Containers monorepo
#
# Place this file at `.gitlab-ci.yml`. GitLab CI uses its own YAML syntax
# (stages, `image`, `script`) rather than GitHub Actions. This pipeline runs
# typecheck, lint, format check, tests, and a production build.
#
# Bun is installed from its official install script. Use a Bun-enabled image
# if you maintain one in your container registry for faster pulls.
#
# A Docker build/smoke-test stage is included but commented out — enable it
# only on a runner with a working Docker daemon (e.g. a `docker`-tagged
# runner with DinD).

stages:
    - check
    - build
    # - smoke

variables:
    BUN_VERSION: '1.3.14'
    # Prevent NPM from being required by bun's install script
    GIT_DEPTH: '0'

cache:
    key: '$CI_COMMIT_REF_SLUG'
    paths:
        - node_modules/
        - .bun/

.check-template: &check-template
    image: oven/bun:1.3.14-alpine
    before_script:
        - bun install --frozen-lockfile
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

typecheck:
    <<: *check-template
    stage: check
    script:
        - bun run typecheck

lint:
    <<: *check-template
    stage: check
    script:
        - bun run lint

format:
    <<: *check-template
    stage: check
    script:
        - bun run format:check

test:
    <<: *check-template
    stage: check
    script:
        - bun test

build:
    image: oven/bun:1.3.14-alpine
    stage: build
    before_script:
        - bun install --frozen-lockfile
    script:
        - bun run build
    artifacts:
        paths:
            - apps/api/dist/
            - apps/engine-agent/dist/
            - apps/traffic-worker/dist/
            - apps/web/.next/
        expire_in: 1 week
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"

