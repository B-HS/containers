# GitHub Actions — CI for the Containers monorepo
#
# Drop this into `.github/workflows/ci.yml`. Runs typecheck, lint, format
# check, unit/integration tests, and a production build on every PR and push
# to `dev`.
#
# Stack: Bun 1.3.14 workspaces. No Docker daemon required for this job (tests
# use in-memory SQLite). A separate compose smoke test is commented out at the
# bottom for hosts that have Docker available.

name: CI

on:
    push:
        branches: [dev, main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: typecheck · lint · test · build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Tests
              run: bun test

            - name: Build
              run: bun run build

    # Optional — only if the runner has Docker. Builds the full stack and
    # verifies all 5 services become healthy.
    compose-smoke:
        name: Compose smoke test
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        steps:
            - uses: actions/checkout@v4
            - name: Build images
              run: docker compose build
            - name: Start stack
              run: docker compose up -d --wait
            - name: Health check
              run: |
                  docker compose ps --format '{{.Name}} {{.Status}}'
                  test "$(docker compose ps --format '{{.Status}}' | grep -c healthy)" -eq 5
