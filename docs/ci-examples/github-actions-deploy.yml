# GitHub Actions — API key 기반 무인 배포 (Containers control plane)
#
# 호출 순서와 성공 판정은 containers-deploy.sh 한 곳에 있다. 이 파일은 GitHub 문법으로 그것을 부르기만
# 한다. Gitea·GitLab 예시도 같은 스크립트를 쓴다.
#
# 준비
#  0. containers-deploy.sh 를 배포할 저장소에 복사한다(예: ci/containers-deploy.sh). CI 는 자기 저장소만
#     체크아웃하므로 이 저장소의 경로를 그대로 참조할 수 없다.
#  1. 패널·API 는 기본적으로 ${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT:-18080} 로만 publish 된다
#     (compose.yaml). GitHub 호스티드 러너는 이 주소에 도달할 수 없다. 다음 중 하나가 필요하다.
#       - 같은 호스트(또는 같은 사설망)에 셀프호스티드 러너를 두고 http://127.0.0.1:18080 사용
#       - cloudflared 등 터널로 공개 주소를 노출하고 https://<도메인> 사용
#     평문 HTTP 로 외부 구간을 지나면 ctk_ 키가 그대로 노출된다. 터널 경유는 반드시 HTTPS 다.
#  2. nginx 는 Host 로 server 블록을 고르고 기본 default_server 는 444 를 돌려준다.
#     API_BASE 의 host 가 패널 server_name 에 없으면 CONTAINERS_API_HOST 로 Host 헤더를 지정한다.
#  3. API key 는 패널에서 발급해 Secrets(CONTAINERS_API_KEY)로만 주입한다. 로그·아티팩트에 남기지 않는다.
#     키는 최대 365일까지만 살고 만료 없는 키는 만들 수 없다. 만료 전에 새 키로 교체한다.
#  4. 필요한 scope (packages/contracts/src/api-key.ts 기준)
#       artifact:upload  업로드 세션·청크·finalize
#       job:read         job 폴링과 이벤트 덤프 (성패 판정의 핵심)
#       image:load       artifact -> docker image load
#       deployment:read  manifest·release·스택 조회
#       deployment:write manifest·스택 생성, release 생성, rollback
#       engine:read      load 결과(/api/images) 확인
#     job:write 는 교착된 job 을 CI 가 직접 취소할 때만 추가한다.
#  5. 배포 manifest 는 저장소에 커밋한다(예: .github/deploy/manifest.json).
#     imageDigest 와 version 은 스크립트가 주입하므로 파일에 넣지 않아도 된다.
#     나머지 필수 필드는 packages/contracts/src/deployment.ts 의 deploymentManifestInputSchema 를 따른다.

name: Deploy via control plane API

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            rollback_release_id:
                description: '되돌릴 현재 healthy release id (지정하면 배포 대신 rollback 만 수행)'
                required: false
                type: string

concurrency:
    group: containers-deploy
    cancel-in-progress: false

env:
    API_BASE: ${{ vars.CONTAINERS_API_BASE }}
    CONTAINERS_API_HOST: ${{ vars.CONTAINERS_API_HOST }}
    DEPLOY_NAME: example-app
    MANIFEST_FILE: .github/deploy/manifest.json

jobs:
    deploy:
        name: build · upload · load · release
        runs-on: self-hosted
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Check tooling
              run: |
                  set -euo pipefail
                  for binary in curl jq docker; do
                      command -v "$binary" > /dev/null || { echo "$binary 가 러너에 없다" >&2; exit 1; }
                  done

            - name: Deploy
              if: ${{ inputs.rollback_release_id == '' }}
              env:
                  CONTAINERS_API_KEY: ${{ secrets.CONTAINERS_API_KEY }}
                  DEPLOY_VERSION: ${{ github.sha }}
                  WORK_DIR: ${{ runner.temp }}/containers-deploy
              run: bash ci/containers-deploy.sh deploy

            - name: Rollback
              if: ${{ inputs.rollback_release_id != '' }}
              env:
                  CONTAINERS_API_KEY: ${{ secrets.CONTAINERS_API_KEY }}
                  DEPLOY_VERSION: ${{ github.sha }}
                  WORK_DIR: ${{ runner.temp }}/containers-deploy
              run: bash ci/containers-deploy.sh rollback '${{ inputs.rollback_release_id }}'

            - name: Dump recent jobs on failure
              if: ${{ failure() }}
              env:
                  CONTAINERS_API_KEY: ${{ secrets.CONTAINERS_API_KEY }}
              run: |
                  set -euo pipefail
                  args=(-sS -H "authorization: Bearer ${CONTAINERS_API_KEY}")
                  if [ -n "${CONTAINERS_API_HOST:-}" ]; then args+=(-H "host: ${CONTAINERS_API_HOST}"); fi
                  curl "${args[@]}" "${API_BASE}/api/jobs?limit=20" | jq '.data[] | {id, kind, status, failureCode, progressStep, finishedAt}' || true
