name: containers

services:
    nginx:
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 256M
        build:
            context: ./infra/nginx
            dockerfile: Dockerfile
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - SETGID
            - SETUID
        depends_on:
            api:
                condition: service_healthy
            web:
                condition: service_healthy
        environment:
            ACCESS_LOG_KEEP: ${ACCESS_LOG_KEEP:-2}
            ACCESS_LOG_MAX_BYTES: ${ACCESS_LOG_MAX_BYTES:-134217728}
            ACCESS_LOG_ROTATE_INTERVAL_SECONDS: ${ACCESS_LOG_ROTATE_INTERVAL_SECONDS:-60}
        healthcheck:
            test:
                - CMD
                - wget
                - --quiet
                - --spider
                - '--header=Host: panel.containers.local'
                - http://127.0.0.1:8080/ko
            interval: 10s
            timeout: 3s
            retries: 5
        ports:
            - ${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT:-18080}:8080
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
            - /var/cache/nginx
            - /var/run
        volumes:
            - nginx-config:/etc/nginx/managed
            - nginx-logs:/var/log/nginx
        networks:
            - control
            - edge
            - ingress

    web:
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 1G
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        environment:
            API_INTERNAL_URL: http://api:3001
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - fetch('http://127.0.0.1:3000/ko').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
            interval: 10s
            timeout: 3s
            retries: 5
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        networks:
            - ingress

    api:
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 2G
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            AGENT_INTERNAL_URL: http://engine-agent:3002
            AGENT_SHARED_SECRET_FILE: /credentials/agent-secret
            ARTIFACT_ROOT: /artifacts
            ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
            ARTIFACT_RETENTION_MINIMUM_COUNT: ${ARTIFACT_RETENTION_MINIMUM_COUNT:-5}
            AUDIT_ARCHIVE_ROOT: /backups/audit-archives
            AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
            BACKUP_ROOT: /backups
            API_PORT: 3001
            AUTH_BASE_URL: ${PANEL_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
            AUTH_SECRET_FILE: /data/auth-secret
            AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:18080,http://localhost:18080}
            CONTROL_DB_PATH: /data/control.sqlite
            CONTROL_MIGRATIONS_PATH: /app/drizzle
            PROBE_NETWORK_NAME: containers_probe
            NGINX_STATUS_URL: http://nginx:8081/status
            NOTIFICATION_SECRET_KEY_FILE: /data/notification-secret-key
            PANEL_PUBLIC_URL: ${PANEL_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
            TRAFFIC_WORKER_INTERNAL_URL: http://traffic-worker:3003
            TRAFFIC_WORKER_SHARED_SECRET_FILE: /traffic-credentials/traffic-secret
            TRAFFIC_EXPORT_ROOT: /backups/traffic-exports
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - fetch('http://127.0.0.1:3001/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
            interval: 10s
            timeout: 3s
            retries: 5
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /home/bun/.bun:uid=1000,gid=1000,mode=0700
            - /tmp
        volumes:
            - agent-credentials:/credentials
            - traffic-credentials:/traffic-credentials
            - artifacts:/artifacts
            - backups:/backups
            - control-data:/data
        networks:
            - ingress
            - control
    engine-agent:
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 1G
        build:
            context: .
            dockerfile: apps/engine-agent/Dockerfile
        group_add:
            - '${DOCKER_GID:-0}'
        environment:
            AGENT_PORT: 3002
            AGENT_SHARED_SECRET_FILE: /credentials/agent-secret
            ARTIFACT_ROOT: /artifacts
            DOCKER_SOCKET_PATH: /var/run/docker.sock
            NGINX_CONFIG_ROOT: /nginx-config
            NGINX_REVISION_KEEP_COUNT: ${NGINX_REVISION_KEEP_COUNT:-20}
            NGINX_STATUS_URL: http://nginx:8081/status
            REGISTRY_CREDENTIAL_FILE: /registry-credentials/registry-credentials.json
            REGISTRY_CREDENTIAL_KEY_FILE: /registry-credentials/registry-credential-key
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - fetch('http://127.0.0.1:3002/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
            interval: 10s
            timeout: 3s
            retries: 5
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        volumes:
            - agent-credentials:/credentials
            - artifacts:/artifacts:ro
            - nginx-config:/nginx-config
            - registry-credentials:/registry-credentials
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - control
            - probe

    traffic-worker:
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits:
                    memory: 1G
        build:
            context: .
            dockerfile: apps/traffic-worker/Dockerfile
        environment:
            ACCESS_LOG_PATH: /var/log/nginx/access.jsonl
            INGEST_CHECKPOINT_PATH: /data/ingest-checkpoint.json
            TRAFFIC_SHARED_SECRET_FILE: /credentials/traffic-secret
            BACKUP_ROOT: /backups
            TRAFFIC_DB_PATH: /data/traffic.sqlite
            TRAFFIC_EXPORT_ROOT: /backups/traffic-exports
            TRAFFIC_MIGRATIONS_PATH: /app/drizzle
            TRAFFIC_RAW_RETENTION_DAYS: 14
            TRAFFIC_MAX_EVENT_ROWS: ${TRAFFIC_MAX_EVENT_ROWS:-2000000}
            TRAFFIC_MAX_DB_BYTES: ${TRAFFIC_MAX_DB_BYTES:-1073741824}
            TRAFFIC_RETENTION_INTERVAL_SECONDS: ${TRAFFIC_RETENTION_INTERVAL_SECONDS:-60}
            TRAFFIC_WORKER_PORT: 3003
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - fetch('http://127.0.0.1:3003/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
            interval: 10s
            timeout: 3s
            retries: 5
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        volumes:
            - traffic-credentials:/credentials
            - backups:/backups
            - nginx-logs:/var/log/nginx:ro
            - traffic-data:/data
        networks:
            - control

networks:
    control:
        internal: true
    # 워크로드와 외부 진입이 만나는 유일한 네트워크다.
    # 앞단 프록시의 실제 클라이언트 IP 를 인정할 주소는 패널의 신뢰 프록시 화면에서 승인한다.
    edge:
        ipam:
            config:
                - subnet: ${EDGE_SUBNET:-10.89.0.0/24}
    probe:
        internal: true
    ingress:
        internal: true

volumes:
    agent-credentials:
    artifacts:
    backups:
    control-data:
    nginx-config:
    nginx-logs:
    registry-credentials:
    traffic-credentials:
    traffic-data:
