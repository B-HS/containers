# 직접 TLS 종단용 compose override 예시 (opt-in).
# 사용: docker compose -f compose.yaml -f infra/nginx/compose.tls.example.yaml up -d
# PANEL_TLS_CERT_DIR 에 fullchain.pem 과 privkey.pem 이 있어야 하며,
# nginx 설정은 infra/nginx/nginx-tls.conf.example 을 패널에서 적용한 뒤여야 한다.
# 설정 적용 전에 이 override 로 먼저 올리면 8443 listener 가 없어 443 연결이 거부된다.

services:
    nginx:
        ports:
            - ${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT:-8080}:8080
            - ${PANEL_TLS_BIND_ADDRESS:-0.0.0.0}:${PANEL_TLS_PORT:-443}:8443
        volumes:
            - nginx-config:/etc/nginx/managed
            - nginx-logs:/var/log/nginx
            - ${PANEL_TLS_CERT_DIR:?PANEL_TLS_CERT_DIR must point to the certificate directory}:/etc/nginx/certs:ro
