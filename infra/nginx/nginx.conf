worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format containers_json escape=json '{"schema_version":1,"timestamp":"$time_iso8601","request_id":"$request_id","cf_ray":"$http_cf_ray","client_ip":"$containers_client_ip","country":"$http_cf_ipcountry","scheme":"$scheme","host":"$host","server_name":"$server_name","method":"$request_method","uri_path":"$uri","protocol":"$server_protocol","status":$status,"request_length":$request_length,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.jsonl containers_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set_real_ip_from 127.0.0.1/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    map $remote_addr $containers_client_ip {
        default $remote_addr;
    }

    limit_req_zone $containers_client_ip zone=containers_api_rate:10m rate=300r/m;
    limit_req_zone $containers_client_ip zone=containers_auth_rate:10m rate=5r/m;
    limit_req_status 429;

    map $http_x_forwarded_proto $containers_forwarded_proto {
        default $scheme;
        https https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream containers_web {
        zone containers_web 64k;
        server web:3000 resolve;
        keepalive 32;
    }

    upstream containers_api {
        zone containers_api 64k;
        server api:3001 resolve;
        keepalive 32;
    }

    server {
        listen 8081;
        server_name _;

        location = /status {
            access_log off;
            stub_status;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080 default_server;
        server_name _;

        return 444;
    }

    server {
        listen 8080;
        server_name panel.containers.local localhost 127.0.0.1;

        set $containers_csp "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'";
        add_header Content-Security-Policy $containers_csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location ~ ^/api/auth/sign-in/email/?$ {
            limit_req zone=containers_auth_rate burst=5 nodelay;
            client_max_body_size 64k;
            proxy_pass http://containers_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $containers_forwarded_proto;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=containers_api_rate burst=100 nodelay;
            client_max_body_size 65m;
            proxy_pass http://containers_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $containers_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://containers_web;
            proxy_http_version 1.1;
            proxy_set_header Content-Security-Policy $containers_csp;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $containers_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    server {
        listen 8080;
        server_name api.containers.local;

        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location ~ ^/api/auth/sign-in/email/?$ {
            limit_req zone=containers_auth_rate burst=5 nodelay;
            client_max_body_size 64k;
            proxy_pass http://containers_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $containers_forwarded_proto;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=containers_api_rate burst=100 nodelay;
            client_max_body_size 65m;
            proxy_pass http://containers_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $containers_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
